[project]
name = "safevoice"
version = "1.0.0"
description = "SafeVoice - Anonymous Trauma-Informed Sexual Assault Reporting Portal with District Police Routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

